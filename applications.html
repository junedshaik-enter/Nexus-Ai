<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Applications</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #06b6d4;
            --accent-2: #8b5cf6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a.active, nav a:hover {
            color: var(--accent-1);
        }

        .container {
            max-width: 1000px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h2 { font-size: 2.2rem; margin-bottom: 10px; }
        .subtitle { color: var(--text-secondary); margin-bottom: 30px; font-size: 1.1rem; }

        .banner-img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-label { color: var(--text-secondary); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ NexusAI</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="models.html">AI Models</a>
            <a href="applications.html" class="active">Applications</a>
            <a href="research.html">Research</a>
        </nav>
    </header>

    <div class="container">
        <h2>Real-World AI Applications</h2>
        <p class="subtitle">Discover how intelligent automation and data visualization power modern industries.</p>
        
        <img src="https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcTnUyYGvByaDqCzrjTGM3-ol-Lx6jT61OSnP964gGI2kRHqGlHfnfTITd6etJzyee6ECjmjP__C_lrlqCk" alt="Futuristic data visualization infographic" class="banner-img">

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">99.8%</div>
                <div class="stat-label">Data Accuracy Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">10x</div>
                <div class="stat-label">Workflow Speedup</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">24/7</div>
                <div class="stat-label">Autonomous Operation</div>
            </div>
        </div>
    </div>

</body>
</html>
