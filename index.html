<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Home</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #06b6d4;
            --accent-2: #8b5cf6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a.active, nav a:hover {
            color: var(--accent-1);
        }

        .hero {
            max-width: 800px;
            text-align: center;
            padding: 60px 20px;
        }

        .badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.1);
            color: #c4b5fd;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        h1 span {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 50px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ NexusAI</div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="models.html">AI Models</a>
        </nav>
    </header>

    <div class="hero">
        <div class="badge">Next-Generation AI Platform</div>
        <h1>Empowering the Future with <span>Artificial Intelligence</span></h1>
        <p>Experience lightning-fast neural processing, seamless automation, and deep cognitive insights tailored for your workflow.</p>
        <div class="btn-group">
            <a href="models.html" class="btn btn-primary">Explore Models</a>
        </div>
    </div>

</body>
</html>
